# Blueprint de Render: crea la base de datos, el backend (Docker) y el
# frontend (sitio estático) de una sola vez. Guía paso a paso: docs/RENDER.md
#
# Los planes están en "free" para probar sin costo. Para uso real en un
# restaurante conviene subirlos desde el panel de Render (la base gratuita y
# los servicios gratuitos tienen límites; ver docs/RENDER.md).

databases:
  - name: restaurante-db
    databaseName: restaurante
    user: restaurante
    plan: free

services:
  # ---------- Backend (API Go) ----------
  - type: web
    name: restaurante-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Containerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurante-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Dirección exacta del frontend (https://...onrender.com, sin "/" al final).
      # Se llena después del primer despliegue; ver docs/RENDER.md paso 4.
      - key: ALLOWED_ORIGIN
        sync: false
      # Primer administrador (solo se crea si la base no tiene usuarios).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador

  # ---------- Frontend (React, sitio estático) ----------
  - type: web
    name: restaurante-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Dirección pública del backend + /api/v1, ej. https://restaurante-api.onrender.com/api/v1
      # Vite la incrusta al compilar: si la cambias, hay que volver a desplegar.
      - key: VITE_API_URL
        sync: false
    routes:
      # La app es de una sola página: cualquier ruta (/mesas, /pedidos…) debe servir index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
