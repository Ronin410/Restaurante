# Orquesta los 3 servicios con Docker Compose (alternativa a PODMAN.md,
# que hace los mismos pasos con `podman run` sueltos). Misma red interna,
# mismos puertos no estándar: Postgres 6543, backend 9090, frontend 4321.
#
# Uso:
#   docker compose up -d --build        # levanta db + backend + frontend
#   docker compose run --rm seed        # siembra datos de demo (una vez)
#   docker compose down                 # detiene todo (conserva el volumen de datos)
#   docker compose down -v              # detiene y borra también los datos

services:
  db:
    image: docker.io/library/postgres:16-alpine
    command: ["postgres", "-c", "port=6543"]
    environment:
      POSTGRES_USER: taqueria
      POSTGRES_PASSWORD: taqueria
      POSTGRES_DB: taqueria
    ports:
      - "6543:6543"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 6543 -U taqueria"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      PGHOST: db
      PGPORT: "6543"
      PGUSER: taqueria
      PGPASSWORD: taqueria
      PGDATABASE: taqueria
      PGSSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      ALLOWED_ORIGIN: http://localhost:4321
      PORT: "9090"
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Contenedor de un solo uso para crear usuarios/mesas/catálogo de demo.
  # No arranca con `docker compose up`; se corre a propósito:
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Containerfile
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      PGHOST: db
      PGPORT: "6543"
      PGUSER: taqueria
      PGPASSWORD: taqueria
      PGDATABASE: taqueria
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["seed"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      # Vite incrusta esta URL en el JavaScript en tiempo de build, no al
      # arrancar el contenedor: tiene que ser alcanzable por el *navegador*
      # (el puerto publicado al host), no el nombre del servicio "backend".
      args:
        VITE_API_URL: http://localhost:9090/api/v1
    ports:
      - "4321:4321"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
