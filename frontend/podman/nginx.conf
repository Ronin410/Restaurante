# Sirve el build estático de la SPA en el puerto no estándar 4321 (ver
# README/PODMAN.md), con fallback a index.html para las rutas de
# react-router-dom (/mesas/5, /cuentas/3, etc. no existen como archivos).
server {
    listen 4321;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El manifest y el service worker deben poder actualizarse sin quedar
    # atrapados en caché del navegador entre despliegues.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
